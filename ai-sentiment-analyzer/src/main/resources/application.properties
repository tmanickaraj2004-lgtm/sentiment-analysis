# Application configuration
server.port=8085
spring.application.name=ai-sentiment-analyzer

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:sentimentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-
sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration (Accessible at http://localhost:8085/h2-console)
spring.h2.console.enabled=true0+
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

